[package]
name = "p3-miden-lifted-examples"
description = "Example AIRs wrapped for the lifted STARK prover."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# Internal
p3-miden-lifted-air.workspace = true

# Plonky3
p3-air.workspace = true
p3-blake3-air = { version = "0.5.0", default-features = false }
p3-field.workspace = true
p3-keccak-air = { version = "0.5.0", default-features = false }
p3-matrix.workspace = true
p3-poseidon2-air = { version = "0.5.0", default-features = false }

# Third-party
rand.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-forest = { version = "0.1.6", features = ["ansi", "smallvec"] }
tracing-subscriber.workspace = true

# Internal
p3-miden-lmcs = { workspace = true, features = ["testing"] }
p3-miden-lifted-stark.workspace = true

# Plonky3
p3-batch-stark = { version = "0.5.0", default-features = false }
p3-challenger.workspace = true
p3-commit.workspace = true
p3-dft.workspace = true
p3-fri.workspace = true
p3-goldilocks.workspace = true
p3-lookup = { version = "0.5.0", default-features = false }
p3-merkle-tree.workspace = true
p3-symmetric.workspace = true
p3-uni-stark = { version = "0.5.0", default-features = false }
p3-util.workspace = true

[features]
default = ["std"]
std = []
parallel = ["p3-miden-lifted-stark/parallel"]

[[bin]]
name = "lifted_keccak"
required-features = ["std"]

[[bin]]
name = "lifted_3_hashes"
required-features = ["std"]

[[bin]]
name = "batch_stark_keccak"
required-features = ["std"]

[[bin]]
name = "batch_stark_3_hashes"
required-features = ["std"]

[[bin]]
name = "lifted_miden"
required-features = ["std"]

[[bin]]
name = "batch_miden"
required-features = ["std"]
