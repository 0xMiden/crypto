[package]
authors.workspace      = true
description            = "CodSpeed benchmarks for Miden crypto SMT operations."
edition.workspace      = true
license.workspace      = true
name                   = "miden-crypto-smt-codspeed-bench"
publish                = false
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[dev-dependencies]
criterion    = { package = "codspeed-criterion-compat", version = "=4.6.0" }
miden-crypto = { default-features = false, path = "../../miden-crypto" }
tempfile     = { workspace = true }

[features]
rocksdb        = ["smt-kvdb-rocks"]
smt-kvdb       = []
smt-kvdb-fjall = ["miden-crypto/smt-kvdb-fjall", "smt-kvdb"]
smt-kvdb-rocks = ["miden-crypto/smt-kvdb-rocks", "smt-kvdb"]

[lib]
doctest = false
test    = false

[[bench]]
harness           = false
name              = "smt_codspeed"
required-features = ["smt-kvdb"]

[lints]
workspace = true
