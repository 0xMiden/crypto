[package]
description            = "Transcript channels for Fiat-Shamir protocols with raw field/commitment storage"
edition                = "2024"
homepage               = "https://github.com/0xMiden/crypto/tree/main/crates"
license                = "MIT OR Apache-2.0"
name                   = "miden-stark-transcript"
readme                 = "../README.md"
repository             = "https://github.com/0xMiden/crypto"
rust-version.workspace = true
version.workspace      = true

[lib]
doctest = false
test    = false

[dependencies]
p3-challenger.workspace = true
p3-field.workspace      = true
serde.workspace         = true
thiserror.workspace     = true

[features]
default = []

# Unsound: forces every `Channel::grind` call to difficulty 0, regardless of
# the requested `bits`. Both prover and verifier honor the override, so the
# transcript layout is preserved while the PoW search is effectively free.
# Intended only for tests/benchmarks where realistic `*_pow_bits` settings
# would dominate runtime; proofs produced with this feature carry no real
# PoW work and must not be relied on for security.
unsound-pow-skip = []

[lints]
workspace = true
