# Verifies that all commits in a PR are signed (GPG or SSH).
# Delegates the actual check to the organization-level reusable workflow.

name: signed commits

permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
    branches:
      - main
      - next
    types: [opened, reopened, synchronize]

jobs:
  check-signed-commits:
    uses: 0xMiden/.github/.github/workflows/signed-commits.yml@main
