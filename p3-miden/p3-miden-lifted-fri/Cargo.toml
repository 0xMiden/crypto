[package]
description  = "Lifted FRI PCS (DEEP quotient + FRI)."
edition      = "2024"
homepage     = "https://github.com/0xMiden/p3-miden"
license      = "MIT OR Apache-2.0"
name         = "p3-miden-lifted-fri"
readme       = "../README.md"
repository   = "https://github.com/0xMiden/p3-miden"
rust-version = "1.90"
version      = "0.5.1"

[dependencies]
# Internal
p3-miden-lmcs.workspace       = true
p3-miden-transcript.workspace = true

# Plonky3
p3-challenger.workspace  = true
p3-commit                = { optional = true, workspace = true }
p3-dft.workspace         = true
p3-field.workspace       = true
p3-matrix.workspace      = true
p3-maybe-rayon.workspace = true
p3-util.workspace        = true

# Third-party
rand.workspace      = true
thiserror.workspace = true
tracing.workspace   = true

[dev-dependencies]
# Internal
p3-miden-dev-utils.workspace = true
p3-miden-lmcs                = { features = ["testing"], workspace = true }

# Plonky3
p3-dft.workspace           = true
p3-fri.workspace           = true
p3-goldilocks.workspace    = true
p3-interpolation.workspace = true
p3-keccak.workspace        = true
p3-merkle-tree.workspace   = true
p3-symmetric.workspace     = true

# Third-party
criterion.workspace          = true
tracing-subscriber.workspace = true

[features]
parallel = ["p3-maybe-rayon/parallel"]
testing  = ["p3-commit", "p3-miden-lmcs/testing"]

[[bench]]
harness           = false
name              = "fri_fold"
required-features = ["testing"]

[[bench]]
harness           = false
name              = "deep_quotient"
required-features = ["testing"]

[[bench]]
harness           = false
name              = "pcs"
required-features = ["testing"]

[[bench]]
harness           = false
name              = "fri_comparison"
required-features = ["testing"]

[[bench]]
harness           = false
name              = "pcs_trace"
required-features = ["testing"]

[lints]
workspace = true
