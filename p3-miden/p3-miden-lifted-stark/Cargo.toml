[package]
name = "p3-miden-lifted-stark"
description = "Lifted STARK prover and verifier (LMCS-based)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true

[dependencies]
# Internal
p3-miden-lifted-air.workspace = true
p3-miden-stateful-hasher.workspace = true
p3-miden-transcript.workspace = true

# Plonky3 (always needed)
p3-challenger.workspace = true
p3-dft.workspace = true
p3-field.workspace = true
p3-goldilocks.workspace = true
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true
p3-symmetric.workspace = true
p3-util.workspace = true

# Optional (for testing/examples features)
p3-blake3 = { workspace = true, optional = true }
p3-blake3-air = { workspace = true, optional = true }
p3-keccak = { workspace = true, optional = true }
p3-keccak-air = { workspace = true, optional = true }
p3-poseidon2-air = { workspace = true, optional = true }

# Third-party
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Plonky3
p3-blake3.workspace = true
p3-challenger.workspace = true
p3-commit.workspace = true
p3-fri.workspace = true
p3-goldilocks.workspace = true
p3-interpolation.workspace = true
p3-keccak.workspace = true
p3-merkle-tree.workspace = true
p3-symmetric.workspace = true

# Third-party
criterion.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
parallel = ["p3-maybe-rayon/parallel"]
testing = [
  "dep:p3-blake3",
  "dep:p3-blake3-air",
  "dep:p3-keccak",
  "dep:p3-keccak-air",
  "dep:p3-poseidon2-air",
]

[[bench]]
name = "quotient_commit"
harness = false
required-features = ["testing"]

[[bench]]
name = "merkle_commit"
harness = false
required-features = ["testing"]

[[bench]]
name = "fri_fold"
harness = false
required-features = ["testing"]

[[bench]]
name = "deep_quotient"
harness = false
required-features = ["testing"]

[[bench]]
name = "pcs"
harness = false
required-features = ["testing"]

[[bench]]
name = "pcs_trace"
harness = false
required-features = ["testing"]

[[bench]]
name = "plonky3"
harness = false
required-features = ["testing"]
