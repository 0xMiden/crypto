[package]
name = "p3-miden-lmcs"
description = "Lifted Matrix Commitment Scheme (LMCS) for matrices with power-of-two heights."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true

[dependencies]
# Internal
p3-miden-stateful-hasher.workspace = true
p3-miden-transcript.workspace = true

# Plonky3
p3-challenger = { workspace = true, optional = true }
p3-field.workspace = true
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true
p3-symmetric.workspace = true
p3-util.workspace = true

# Optional (for testing feature)
p3-keccak = { workspace = true, optional = true }
p3-miden-dev-utils = { workspace = true, optional = true }

# Third-party
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Internal
p3-miden-dev-utils.workspace = true

# Plonky3
p3-blake3.workspace = true
p3-challenger.workspace = true
p3-commit.workspace = true
p3-goldilocks.workspace = true
p3-keccak.workspace = true
p3-merkle-tree.workspace = true

# Third-party
criterion.workspace = true

[features]
parallel = ["p3-maybe-rayon/parallel"]
testing = ["dep:p3-challenger", "dep:p3-keccak", "dep:p3-miden-dev-utils"]

[[bench]]
name = "merkle_commit"
harness = false
required-features = ["testing"]

[[bench]]
name = "lmcs_vs_mmcs"
harness = false
required-features = ["testing"]
