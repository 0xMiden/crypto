[package]
name = "p3-miden-lifted-fri"
description = "Lifted FRI PCS (DEEP quotient + FRI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true

[dependencies]
# Internal
p3-miden-lmcs.workspace = true
p3-miden-transcript.workspace = true

# Plonky3
p3-challenger.workspace = true
p3-commit.workspace = true
p3-dft.workspace = true
p3-field.workspace = true
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true
p3-util.workspace = true

# Third-party
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Internal
p3-miden-dev-utils.workspace = true
p3-miden-lmcs = { workspace = true, features = ["testing"] }

# Plonky3
p3-dft.workspace = true
p3-fri.workspace = true
p3-goldilocks.workspace = true
p3-interpolation.workspace = true
p3-keccak.workspace = true
p3-merkle-tree.workspace = true
p3-symmetric.workspace = true

# Third-party
criterion.workspace = true
tracing-subscriber.workspace = true

[features]
parallel = ["p3-maybe-rayon/parallel"]
testing = ["p3-miden-lmcs/testing"]

[[bench]]
name = "fri_fold"
harness = false
required-features = ["testing"]

[[bench]]
name = "deep_quotient"
harness = false
required-features = ["testing"]

[[bench]]
name = "pcs"
harness = false
required-features = ["testing"]

[[bench]]
name = "fri_comparison"
harness = false
required-features = ["testing"]

[[bench]]
name = "pcs_trace"
harness = false
required-features = ["testing"]
