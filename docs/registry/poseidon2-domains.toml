# Poseidon2 domain registry draft.
#
# Numeric IDs are normative. Names are for review, docs, and generated constants.
# Keep entries sorted by domain_id, then version.

# -----------------------------------------------------------------------------
# Global range allocations
# -----------------------------------------------------------------------------
#
# This section allocates domain_id ranges to maintainer repositories. Delegated
# repositories maintain their concrete entries in their own ranges.

[[ranges]]
name = "Miden Crypto primitives and data structures"
maintainer = "https://github.com/0xMiden/crypto"
start = 0x000001
end = 0x00ffff
description = "Capacity domains maintained in the crypto repository."

[[ranges]]
name = "Miden VM domains"
maintainer = "https://github.com/0xMiden/miden-vm"
start = 0x010000
end = 0x01ffff
description = "Capacity domains maintained in the miden-vm repository."

[[ranges]]
name = "Miden protocol domains"
maintainer = "https://github.com/0xMiden/protocol"
start = 0x020000
end = 0x02ffff
description = "Capacity domains maintained in the protocol repository."

[[ranges]]
name = "Miden ecosystem domains"
maintainer = "https://github.com/0xMiden"
start = 0x100000
end = 0x10ffff
description = "Initial allocation for ecosystem and application capacity domains."

# The gaps 0x030000..0x0fffff and 0x110000..0xffffff are intentionally
# unassigned. They are spare capacity for future maintained ranges, not
# experimental/local space.

# -----------------------------------------------------------------------------
# Miden Crypto concrete domains
# -----------------------------------------------------------------------------
#
# Concrete domains maintained in this repository. Other allocated ranges are
# delegated and intentionally left empty here.

[[domains]]
name = "SMT_BUCKET_LEAF"
domain_id = 0x000001
version = 1
maintainer = "https://github.com/0xMiden/crypto"
status = "proposed"
payload_kind = "felt_stream"
frame = "flattened_key_value_element_count mod 8 (= 0)"
param0 = "num_entries (1..=1024)"
param1 = "0"
rate = "flattened sorted (key, value) pairs"

[[domains]]
name = "MMR_PEAKS"
domain_id = 0x000002
version = 1
maintainer = "https://github.com/0xMiden/crypto"
status = "proposed"
payload_kind = "felt_stream"
frame = "padded_peak_element_count mod 8 (= 0)"
param0 = "num_leaves low 32 bits"
param1 = "num_leaves high 32 bits"
rate = "canonical zero-padded peak vector"
