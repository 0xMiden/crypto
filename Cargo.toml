[workspace]
exclude = ["miden-crypto-fuzz"]
members = [
  "miden-crypto",
  "miden-crypto-derive",
  "miden-field",
  "miden-serde-utils",
  "p3-miden/p3-miden-bench",
  "p3-miden/p3-miden-lifted-air",
  "p3-miden/p3-miden-lifted-stark",
  "p3-miden/p3-miden-stateful-hasher",
  "p3-miden/p3-miden-transcript",
]
resolver = "3"

[workspace.package]
authors      = ["miden contributors"]
categories   = ["cryptography", "no-std"]
edition      = "2024"
keywords     = ["crypto", "hash", "merkle", "miden"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/0xMiden/crypto"
rust-version = "1.90"
version      = "0.24.0"

[workspace.dependencies]
miden-crypto-derive      = { path = "miden-crypto-derive", version = "0.24" }
miden-field              = { path = "miden-field", version = "0.24" }
miden-serde-utils        = { path = "miden-serde-utils", version = "0.24" }
p3-miden-lifted-air      = { default-features = false, path = "p3-miden/p3-miden-lifted-air", version = "0.5.1" }
p3-miden-lifted-stark    = { default-features = false, path = "p3-miden/p3-miden-lifted-stark", version = "0.5.1" }
p3-miden-stateful-hasher = { default-features = false, path = "p3-miden/p3-miden-stateful-hasher", version = "0.5.1" }
p3-miden-transcript      = { default-features = false, path = "p3-miden/p3-miden-transcript", version = "0.5.1" }

# Plonky3
p3-air           = { default-features = false, version = "0.5" }
p3-batch-stark   = { default-features = false, version = "0.5" }
p3-blake3        = { default-features = false, version = "0.5" }
p3-blake3-air    = { default-features = false, version = "0.5" }
p3-bn254         = { default-features = false, version = "0.5" }
p3-challenger    = { default-features = false, version = "0.5" }
p3-commit        = { default-features = false, version = "0.5" }
p3-dft           = { default-features = false, version = "0.5" }
p3-field         = { default-features = false, version = "0.5" }
p3-fri           = { default-features = false, version = "0.5" }
p3-goldilocks    = { default-features = false, version = "0.5" }
p3-interpolation = { default-features = false, version = "0.5" }
p3-keccak        = { default-features = false, version = "0.5" }
p3-keccak-air    = { default-features = false, version = "0.5" }
p3-lookup        = { default-features = false, version = "0.5" }
p3-matrix        = { default-features = false, version = "0.5" }
p3-maybe-rayon   = { default-features = false, version = "0.5" }
p3-merkle-tree   = { default-features = false, version = "0.5" }
p3-mersenne-31   = { default-features = false, version = "0.5" }
p3-poseidon2-air = { default-features = false, version = "0.5" }
p3-symmetric     = { default-features = false, version = "0.5" }
p3-uni-stark     = { default-features = false, version = "0.5" }
p3-util          = { default-features = false, version = "0.5" }

# Shared third-party dependencies used by imported p3-miden crates
clap               = { features = ["derive"], version = "4" }
criterion          = { features = ["html_reports"], version = "0.8" }
postcard           = { default-features = false, features = ["alloc"], version = "1" }
rand               = { default-features = false, version = "0.10.0" }
serde              = { default-features = false, features = ["alloc", "derive"], version = "1.0" }
thiserror          = { default-features = false, version = "2.0" }
tracing            = { default-features = false, features = ["attributes"], version = "0.1.37" }
tracing-forest     = "0.1.6"
tracing-subscriber = { features = ["env-filter", "fmt", "std"], version = "0.3.17" }

[workspace.lints.rust]
# Suppress warnings about `cfg(fuzzing)`, which is automatically set when using `cargo-fuzz`.
unexpected_cfgs = { check-cfg = ['cfg(fuzzing)'], level = "warn" }

[profile.test-release]
debug            = 2
debug-assertions = true
inherits         = "release"
overflow-checks  = true
